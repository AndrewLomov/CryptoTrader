name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CryptoTrader.slnx

      - name: Build
        run: dotnet build CryptoTrader.slnx -c Release

      - name: Test
        run: dotnet test CryptoTrader.slnx -c Release --filter "Category!=Integration"

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Confirm Docker
        run: docker version

      - name: Restore
        run: dotnet restore CryptoTrader.slnx

      - name: Build
        run: dotnet build CryptoTrader.slnx -c Release

      - name: Test
        run: dotnet test CryptoTrader.slnx -c Release --filter "Category=Integration"
