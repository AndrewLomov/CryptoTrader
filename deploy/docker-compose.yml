# Local CryptoTrader 0.1 stack. Run from this directory: docker compose up --build
# Live trading stays off. These environment values override env_file.

name: cryptotrader

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}"
    volumes:
      - cryptotrader-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  cryptotrader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      Persistence__ApplyMigrationsOnStartup: "true"
      Persistence__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Execution__Mode: Paper
      Execution__LiveTradingEnabled: "false"
      Risk__AllowFuturesLive: "false"
      Risk__AllowCrossMargin: "false"
      MarketData__UseClosedCandlesForStrategies: "true"
    stop_grace_period: 30s

volumes:
  cryptotrader-postgres:
    name: cryptotrader-postgres
